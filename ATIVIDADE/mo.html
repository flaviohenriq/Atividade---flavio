<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Desafio Flexbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Desafio</h1>

  <div class="container">

    <!-- Linha 1 -->
    <div class="linha">
      <div class="box"></div>
      <span>-</span>
      <div class="box"></div>
      <span>= 20</span>
    </div>

    <!-- Linha 2 -->
    <div class="linha">
      <div class="box"></div>
      <span>+</span>
      <div class="box"></div>
      <span>= 17</span>
    </div>

    <!-- Resultado -->
    <div class="linha resultado">
      <span>= 25</span>
      <span>= 20</span>
    </div>

  </div>

</body>
</html>
